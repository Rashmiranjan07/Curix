# Server Configuration
server.port=8080
server.servlet.context-path=/

spring.application.name=curix-backend

# MySQL Connection (Change password to match your local MySQL root password)
spring.datasource.url=jdbc:mysql://localhost:3306/curix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=021105
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'validate' checks your Java entity classes against the Flyway database tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
#spring.flyway.locations=classpath:db/migration

# Curix Security & JWT Settings
curix.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
curix.jwt.access-token-expiration-ms=900000
curix.jwt.refresh-token-expiration-ms=604800000

# Swagger UI / OpenAPI Documentation Path
springdoc.swagger-ui.path=/swagger-ui.html